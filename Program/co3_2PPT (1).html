<!DOCTYPE html>
<html>
<head>
<title>All ES6 Topics - One File</title>
<style>
body{font-family:Arial; padding:20px; background:#f2f2f2;}
.box{background:white; padding:15px; margin:10px 0; border-radius:8px; border-left:5px solid #1a237e;}
h2{color:#1a237e;}
b{color:#1a237e;}
</style>
</head>
<body>
<h2>ES6+ All Topics - Live Output</h2>
<div id="out"></div>

<script>
let out = "";

// 1. Arrow Function
const double = x => x * 2;
out += "<div class='box'><b>1. Arrow Function</b><br>const double = x => x*2<br>double(5) = " + double(5) + "</div>";

// 2. Destructuring - Object
const user = {name:"Asha", marks:90};
const {name, marks} = user;
out += "<div class='box'><b>2. Destructuring - Object</b><br>const {name, marks} = user<br>name = " + name + ", marks = " + marks + "</div>";

// 2b. Destructuring - Array
const scores = [82, 91, 76];
const [math, , science] = scores;
out += "<div class='box'><b>2b. Destructuring - Array</b><br>const [math, , science] = [82,91,76]<br>math = " + math + ", science = " + science + " (91 skip ayyindi)</div>";

// 3. Spread - Copy + Merge
const a = [1,2];
const b = [...a, 3];
out += "<div class='box'><b>3. Spread ...</b><br>const b = [...a, 3]<br>b = [" + b + "]</div>";

// 3b. Spread - Merge Two Arrays
const boys = ["Ram","Sai"];
const girls = ["Asha","Leela"];
const all = [...boys, ...girls];
out += "<div class='box'><b>3b. Spread - Merge</b><br>[...boys, ...girls]<br>all = [" + all + "]</div>";

// 4. Rest - Collect
function sum(...nums){ return nums; }
out += "<div class='box'><b>4. Rest ...</b><br>function sum(...nums)<br>sum(1,2,3) = [" + sum(1,2,3) + "]</div>";

// 5. Template Literals
const sname = "Asha";
const msg = `Welcome ${sname}, you are in Year 1`;
out += "<div class='box'><b>5. Template Literals</b><br>`Welcome ${sname}`<br>Output: " + msg + "</div>";

// 6. Modules - Demo (same file lo)
function avg(x,y){ return (x+y)/2; }
out += "<div class='box'><b>6. Modules</b><br>export function avg() in math.js<br>import in app.js<br>avg(80,90) = " + avg(80,90) + "</div>";

// 7. Higher-Order Function
function greet(fn){ fn(); }
let hofResult = "";
greet(()=> { hofResult = "Hi from callback!"; });
out += "<div class='box'><b>7. Higher-Order Function</b><br>function greet(fn){ fn(); }<br>Result: " + hofResult + "</div>";

// 8. Array Methods
const nums = [1,2,3];
const mapped = nums.map(n => n+1);
const filtered = [10,5,20].filter(n => n>9);
const reduced = [80,90,70].reduce((a,b)=>a+b, 0);
const found = [4,8,12].find(n=>n>5);

out += "<div class='box'><b>8. Array Methods</b><br>";
out += "map: [1,2,3].map(n=>n+1) = [" + mapped + "]<br>";
out += "filter: [10,5,20].filter(n=>n>9) = [" + filtered + "]<br>";
out += "reduce: [80,90,70].reduce = " + reduced + "<br>";
out += "find: [4,8,12].find(n=>n>5) = " + found + "</div>";

// Final - All Together
const student = "Leela";
const studentMarks = [80,90,70];
const avgMarks = studentMarks.reduce((x,y)=>x+y,0)/3;
out += "<div class='box'><b>Final - Anni Kalipi</b><br>" + `${student}: Average = ${avgMarks}` + "</div>";

document.getElementById("out").innerHTML = out;
</script>
</body>
</html>
